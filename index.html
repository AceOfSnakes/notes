<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes - Ace Of Snakes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
</head>
<body class="markdown-body">
  <div class="avatar-frame" style="vertical-align:top;"><img src="https://github.com/aceofsnakes.png" alt="Profile Avatar"></div>
  <h1>Notes - Ace Of Snakes</h1>
  <div id="content">Loading NOTES.md...</div>
  <script>
    fetch('NOTES.md')
      .then(r => r.text())
      .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
        document.querySelectorAll('pre').forEach(pre => {
          const btn = document.createElement('button');
          btn.className = 'copy-btn';
          btn.textContent = 'Copy';
          btn.onclick = () => {
            navigator.clipboard.writeText(pre.querySelector('code').innerText);
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = 'Copy', 1500);
          };
          pre.appendChild(btn);
        });
      });
  </script>
</body>
</html>
